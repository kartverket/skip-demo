apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: skip-demo
spec:
  image: ghcr.io/kartverket/skip-demo:latest
  port: 8080
  routingProvider: Standard
  ingresses:
    - skip-demo.atkv3-dev.kartverket-intern.cloud
  replicas:
    min: 2
    max: 5
    targetCpuUtilization: 80
  env:
    - name: PORT
      value: "8080"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  liveness:
    path: /healthz
    port: 8080
    failureThreshold: 3
    timeout: 1
    initialDelay: 0
  readiness:
    path: /readyz
    port: 8080
    failureThreshold: 3
    timeout: 1
    initialDelay: 0
